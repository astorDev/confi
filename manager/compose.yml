name: confi-manager

services:
  host:
    image: vosarat/confi
    labels:
      - family=nist
    profiles: [ apps, all ]
    build:
      context: .
      dockerfile: host/Dockerfile
    environment:
      - CONNECTION_STRINGS_MONGO=mongodb://db:27017/
      - PREFIX=${CONFI_MANAGER_PREFIX}
    ports:
      - "40398:8080"
      
  db:
    image: mongo
    ports:
      - "27017:27017"