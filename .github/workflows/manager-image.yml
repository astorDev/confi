on:
  push:
    paths:
      - '.github/workflows/manager-image.yml'
      - 'manager/**'
  workflow_dispatch:
    
jobs:
  local-action:
    runs-on: ubuntu-latest
    steps:
      - uses: astorDev/versy/calver/docker@main
        with:
          image: 'vosarat/confi'
          build-context-path: 'manager/host'
          dockerfile-path: 'manager/host/Dockerfile'
          docker-login: 'vosarat'
          docker-password: ${{ secrets.DOCKER_PASSWORD }}